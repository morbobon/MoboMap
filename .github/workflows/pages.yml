# Builds the public single-file app (no private design systems) and publishes it on the gh-pages branch.
# One-time setup in the repo: Settings -> Pages -> Build and deployment -> Source: "Deploy from a branch",
# Branch: gh-pages, folder: / (root).
name: Publish demo (gh-pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # tools/build.mjs only uses Node built-ins, so no npm install is needed
      - name: Build public index.html
        run: node tools/build.mjs --public --out=_site/index.html
      - name: Check the build
        run: node tools/check.mjs
      - name: Push to gh-pages
        run: |
          cd _site
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
