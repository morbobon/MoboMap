<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoboMap – Design Studio</title>
    <script>
      /*__JSPDF__*/
    </script>
    <!-- Valgfri: designsystems.js i samme mappe (window.DESIGN_SYSTEMS = [...]). Ignoreres hvis den mangler. -->
    <script src="designsystems.js" onerror="void 0"></script>
    <style>
      /*__CSS__*/
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>
          <span data-i18n="app_title">MoboMap – Design Studio</span
          ><small data-i18n="app_sub"
            >Choose design system, map, layout, style and highlight groups · click the map or paste lists ·
            export</small
          >
        </h1>
      </div>
      <div class="btns">
        <select id="ds" class="hdr" onchange="setDS(this.value)" data-i18n-title="sec_ds"></select>
        <button id="uiMode" class="hdr" onclick="cycleUiMode()"></button>
        <select
          id="langSel"
          onchange="setLang(this.value)"
          style="width: auto; padding: 5px 8px; font-size: 12px"
        ></select>
        <button onclick="document.getElementById('projFile').click()" data-i18n="open_project">Open project</button>
        <button onclick="saveProject()" data-i18n="save_project">Save project</button>
        <input
          type="file"
          id="projFile"
          accept=".json,application/json"
          style="display: none"
          onchange="
            openProjectFile(this.files[0]);
            this.value = '';
          "
        />
        <span style="width: 8px"></span>
        <button class="exp alt" onclick="exportMap('png')">PNG</button>
        <button class="exp alt" onclick="exportMap('jpg')">JPG</button>
        <button class="exp" onclick="exportMap('pdf')">PDF</button>
      </div>
    </header>
    <main>
      <aside>
        <section class="sec" data-sec="map">
          <h2 onclick="toggleSec('map')">
            <span class="chev"></span><span data-i18n="sec_map"></span>
            <span class="help" data-i18n-title="map_note" onclick="event.stopPropagation()">ⓘ</span
            ><span class="sum" id="mapInfo"></span>
          </h2>
          <div class="body">
            <select id="focusSel2" onchange="setFocus(this.value)" class="strong"></select>
            <div class="row">
              <select
                id="attrSel"
                onchange="
                  S.attr = this.value;
                  ui();
                  render();
                "
                style="flex: 1"
              ></select>
              <button class="chip" onclick="attrToGroups()" id="attrBtn">
                <span data-i18n="attr_to_groups"></span>
              </button>
            </div>
            <select
              id="projSel"
              onchange="
                S.proj = this.value;
                ui();
                render();
              "
            ></select>
            <select id="farSel" onchange="setFar(this.value)">
              <option value="inset" data-i18n="far_inset"></option>
              <option value="show" data-i18n="far_show"></option>
              <option value="hide" data-i18n="far_hide"></option>
            </select>
          </div>
        </section>
        <section class="sec" data-sec="groups">
          <h2 onclick="toggleSec('groups')">
            <span class="chev"></span><span data-i18n="sec_groups"></span>
            <span class="help" data-i18n-title="groups_note" onclick="event.stopPropagation()">ⓘ</span
            ><span class="sum" id="count"></span>
          </h2>
          <div class="body">
            <div id="groups"></div>
            <div class="row">
              <button class="chip" onclick="addGroup()"><span data-i18n="new_group"></span></button>
              <button class="chip" onclick="clearGroups()"><span data-i18n="clear_groups"></span></button>
            </div>
            <select
              id="regionPresets"
              onchange="
                presetRegionActive(this.value);
                this.value = '';
              "
            ></select>
          </div>
        </section>
        <section class="sec" data-sec="style">
          <h2 onclick="toggleSec('style')">
            <span class="chev"></span><span data-i18n="sec_style"></span><span class="sum" id="styleNo"></span>
          </h2>
          <div class="body">
            <div class="grid3" id="styles"></div>
          </div>
        </section>
        <section class="sec" data-sec="layout">
          <h2 onclick="toggleSec('layout')">
            <span class="chev"></span><span data-i18n="sec_layout"></span><span class="sum" id="layoutInfo"></span>
          </h2>
          <div class="body">
            <div class="grid4" id="layouts"></div>
          </div>
        </section>
        <section class="sec" data-sec="text">
          <h2 onclick="toggleSec('text')">
            <span class="chev"></span><span data-i18n="sec_text"></span><span class="sum" id="textInfo"></span>
          </h2>
          <div class="body">
            <label class="ck"
              ><input type="checkbox" id="showText" checked onchange="render()" /> <span data-i18n="show_title"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="autoText" checked onchange="render()" /> <span data-i18n="auto_text"></span
            ></label>
            <input
              type="text"
              id="title"
              value=""
              oninput="
                document.getElementById('autoText').checked = false;
                render();
              "
              data-i18n-ph="ph_title"
            />
            <input
              type="text"
              id="sub"
              value=""
              oninput="
                document.getElementById('autoText').checked = false;
                render();
              "
              data-i18n-ph="ph_sub"
            />
            <div class="row2">
              <label
                ><span data-i18n="pos_title_l"></span
                ><select id="titlePos" onchange="render()">
                  <option value="auto" data-i18n="pos_auto"></option>
                  <option value="tl" data-i18n="pos_tl"></option>
                  <option value="tc" data-i18n="pos_tc"></option>
                  <option value="tr" data-i18n="pos_tr"></option>
                  <option value="bl" data-i18n="pos_bl"></option>
                  <option value="bc" data-i18n="pos_bc"></option>
                  <option value="br" data-i18n="pos_br"></option></select
              ></label>
              <label
                ><span data-i18n="pos_sub_l"></span
                ><select id="subPos" onchange="render()">
                  <option value="under" data-i18n="pos_under"></option>
                  <option value="tl" data-i18n="pos_tl"></option>
                  <option value="tc" data-i18n="pos_tc"></option>
                  <option value="tr" data-i18n="pos_tr"></option>
                  <option value="bl" data-i18n="pos_bl"></option>
                  <option value="bc" data-i18n="pos_bc"></option>
                  <option value="br" data-i18n="pos_br"></option></select
              ></label>
            </div>
          </div>
        </section>
        <section class="sec" data-sec="display">
          <h2 onclick="toggleSec('display')">
            <span class="chev"></span><span data-i18n="sec_display"></span><span class="sum" id="displayInfo"></span>
          </h2>
          <div class="body">
            <label class="ck"
              ><input type="checkbox" id="labels" onchange="render()" /> <span data-i18n="show_all_names"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="showCities" checked onchange="render()" />
              <span data-i18n="show_cities"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="showNeighbours" checked onchange="render()" />
              <span data-i18n="show_neighbours"></span
            ></label>
            <select id="frameSel" onchange="render()">
              <option value="auto" data-i18n="frame_auto"></option>
              <option value="on" data-i18n="frame_on"></option>
              <option value="off" data-i18n="frame_off"></option>
            </select>
            <label class="ck"
              ><input type="checkbox" id="relief" onchange="render()" /> <span data-i18n="show_relief"></span
            ></label>
            <label class="ck"
              ><input
                type="checkbox"
                id="focusHide"
                onchange="
                  S.focusHide = this.checked;
                  render();
                " />
              <span data-i18n="focus_hide"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="legend" checked onchange="render()" /> <span data-i18n="show_legend"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="showLogo" checked onchange="render()" /> <span data-i18n="show_logo"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="detail" checked onchange="render()" /> <span data-i18n="detail_coast"></span
            ></label>
          </div>
        </section>
        <section class="sec" data-sec="ds">
          <h2 onclick="toggleSec('ds')">
            <span class="chev"></span><span data-i18n="sec_ds"></span><span class="sum" id="dsName"></span>
          </h2>
          <div class="body">
            <div class="row" id="dsSw"></div>
            <details id="manage">
              <summary data-i18n="manage_profiles"></summary>
              <div class="row">
                <button class="chip" onclick="document.getElementById('dsFile').click()">
                  <span data-i18n="import"></span>
                </button>
                <button class="chip" onclick="openEditor()"><span data-i18n="edit_new"></span></button>
                <button class="chip" onclick="exportDS()"><span data-i18n="export_json"></span></button>
                <button class="chip" onclick="exportSidecar()">designsystems.js</button>
                <button class="chip" id="dsDel" onclick="deleteDS()"><span data-i18n="delete"></span></button>
                <input
                  type="file"
                  id="dsFile"
                  accept=".json,.js,application/json"
                  hidden
                  onchange="
                    importDSFile(this.files[0]);
                    this.value = '';
                  "
                />
              </div>
              <details id="editor">
                <summary data-i18n="editor_sum"></summary>
                <textarea id="dsJson" rows="12" class="mono"></textarea>
                <div class="row">
                  <button class="chip" onclick="document.getElementById('logoFile').click()">
                    <span data-i18n="pick_logo"></span>
                  </button>
                  <input
                    type="file"
                    id="logoFile"
                    accept="image/*"
                    hidden
                    onchange="
                      pickLogo(this.files[0]);
                      this.value = '';
                    "
                  />
                  <button class="chip on" onclick="applyEditor()"><span data-i18n="save"></span></button>
                </div>
                <p class="note" data-i18n="editor_note"></p>
              </details>
            </details>
          </div>
        </section>
        <section class="sec" data-sec="footer">
          <h2 onclick="toggleSec('footer')">
            <span class="chev"></span><span data-i18n="sec_footer"></span><span class="sum" id="partnerCount"></span>
          </h2>
          <div class="body">
            <label class="ck"
              ><input type="checkbox" id="showFooter" checked onchange="render()" />
              <span data-i18n="show_footer"></span
            ></label>
            <input
              type="text"
              id="footerLabel"
              value=""
              oninput="
                this.dataset.auto = '0';
                render();
              "
              data-i18n-ph="ph_footer"
            />
            <div id="partners"></div>
            <details>
              <summary data-i18n="add_partner"></summary>
              <input type="text" id="pName" data-i18n-ph="ph_name" />
              <input type="url" id="pLink" data-i18n-ph="ph_link" />
              <div class="row">
                <button class="chip" onclick="document.getElementById('pFile').click()">
                  <span data-i18n="pick_logo_p"></span>
                </button>
                <input
                  type="file"
                  id="pFile"
                  accept="image/*"
                  hidden
                  onchange="
                    pickPartnerLogo(this.files[0]);
                    this.value = '';
                  "
                />
                <span id="pFileName" class="note"></span>
                <button class="chip on" onclick="addPartner()"><span data-i18n="add"></span></button>
              </div>
              <p class="note" data-i18n="partner_note"></p>
            </details>
          </div>
        </section>
      </aside>
      <div class="stage">
        <div id="wrap">
          <svg id="svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg"></svg>
          <button id="zoomReset" class="chip" onclick="resetZoom()" data-i18n="zoom_reset"></button>
        </div>
      </div>
    </main>
    <div id="tip"></div>
    <div id="toast"></div>
    <script>
      /*__JS__*/
    </script>
  </body>
</html>
