<!doctype html>

  SPDX-License-Identifier: AGPL-3.0-only (commercial licences available)

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoboMap – Design Studio</title>
    <!-- Valgfri: designsystems.js i samme mappe (window.DESIGN_SYSTEMS = [...]). Ignoreres hvis den mangler. -->
    <script src="designsystems.js" onerror="void 0"></script>
    <style>
      /*__CSS__*/
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>
          <a class="home" href="./" onclick="return goHome(event);" data-i18n-title="home_t"
            ><span data-i18n="app_title">MoboMap – Design Studio</span></a
          ><small data-i18n="app_sub"
            >Choose design system, map, layout, style and highlight groups · click the map or paste lists ·
            export</small
          >
        </h1>
      </div>
      <div class="btns">
        <select id="ds" class="hdr" onchange="setDS(this.value)" data-i18n-title="sec_ds"></select>
        <button id="undoBtn" class="hdr" data-i18n-label="lbl_undo" onclick="undo()" data-i18n-title="undo">↶</button>
        <button id="redoBtn" class="hdr" data-i18n-label="lbl_redo" onclick="redo()" data-i18n-title="redo">↷</button>
        <button id="resetBtn" class="hdr" onclick="goHome()" data-i18n-title="home_t" data-i18n-label="lbl_reset">
          ⟲
        </button>
        <button
          id="shareBtn"
          class="hdr"
          data-i18n-label="lbl_share"
          onclick="shareLink()"
          data-i18n-title="share_link"
        >
          🔗
        </button>
        <button id="panelBtn" class="hdr" onclick="toggleChrome('panel')" data-i18n-title="toggle_panel">◧</button>
        <button id="stripBtn" class="hdr" onclick="toggleChrome('strip')" data-i18n-title="toggle_strip">⬓</button>
        <button
          id="fsBtn"
          class="hdr"
          data-i18n-label="lbl_fullscreen"
          onclick="toggleFullscreen()"
          data-i18n-title="fullscreen"
        >
          ⛶
        </button>
        <select id="uiStyle" class="hdr" onchange="setUiStyle(this.value)" data-i18n-title="ui_style"></select>
        <button id="uiMode" class="hdr" onclick="cycleUiMode()"></button>
        <select
          id="langSel"
          onchange="setLang(this.value)"
          style="width: auto; padding: 5px 8px; font-size: 12px"
        ></select>
        <button onclick="document.getElementById('projFile').click()" data-i18n="open_project">Open project</button>
        <button onclick="saveProject()" data-i18n="save_project">Save project</button>
        <input
          type="file"
          id="projFile"
          accept=".json,application/json"
          style="display: none"
          onchange="
            openProjectFile(this.files[0]);
            this.value = '';
          "
        />
        <button id="moreBtn" class="hdr" onclick="toggleMore(event)" data-i18n-title="more_t">⋯</button>
        <span class="expwrap">
          <button class="exp" id="expBtn" onclick="toggleExportMenu(event)"><span data-i18n="export"></span> ▾</button>
          <span class="expmenu" id="expMenu">
            <button onclick="exportMap('png')">PNG</button>
            <button onclick="exportMap('jpg')">JPG</button>
            <button onclick="exportMap('pdf')">PDF · A4</button>
            <button onclick="openPrint()" data-i18n="print_menu"></button>
          </span>
        </span>
      </div>
    </header>
    <main>
      <nav class="rail">
        <button data-tab="map" onclick="railTap('map')"><b>⌖</b><span data-i18n="tab_map"></span></button>
        <button data-tab="highlight" onclick="railTap('highlight')">
          <b>◉</b><span data-i18n="tab_highlight"></span>
        </button>
        <button data-tab="look" onclick="railTap('look')"><b>✦</b><span data-i18n="tab_look"></span></button>
        <button data-tab="page" onclick="railTap('page')"><b>▭</b><span data-i18n="tab_page"></span></button>
        <button data-tab="brand" onclick="railTap('brand')"><b>◆</b><span data-i18n="tab_brand"></span></button>
        <button class="railhide" onclick="toggleChrome('panel')" data-i18n-title="toggle_panel">«</button>
      </nav>
      <aside>
        <div class="tab" data-tab="map">
          <section class="sec" data-sec="map">
            <h2 onclick="toggleSec('map')">
              <span class="chev"></span><span data-i18n="sec_map"></span>
              <span class="help" data-i18n-title="map_note" onclick="event.stopPropagation()">ⓘ</span
              ><span class="sum" id="mapInfo"></span>
            </h2>
            <div class="body">
              <select id="focusSel2" onchange="setFocus(this.value)" class="strong"></select>

              <select
                id="projSel"
                onchange="
                  S.proj = this.value;
                  ui();
                  render();
                "
              ></select>
              <label class="ck" id="repWorldRow" data-i18n-title="rep_world_t"
                ><input
                  type="checkbox"
                  id="repWorld"
                  onchange="
                    S.repeat = this.checked;
                    render();
                  " />
                <span data-i18n="rep_world"></span
              ></label>
              <select id="farSel" onchange="setFar(this.value)">
                <option value="inset" data-i18n="far_inset"></option>
                <option value="show" data-i18n="far_show"></option>
                <option value="hide" data-i18n="far_hide"></option>
              </select>
            </div>
          </section>
          <section class="sec" data-sec="display">
            <h2 onclick="toggleSec('display')">
              <span class="chev"></span><span data-i18n="sec_display"></span><span class="sum" id="displayInfo"></span>
            </h2>
            <div class="body">
              <label class="ck"
                ><input type="checkbox" id="labels" onchange="render()" /> <span data-i18n="show_all_names"></span
              ></label>
              <label class="ck"
                ><input type="checkbox" id="showCities" checked onchange="render()" />
                <span data-i18n="show_cities"></span
              ></label>
              <label class="ck"
                ><input type="checkbox" id="showNeighbours" checked onchange="render()" />
                <span data-i18n="show_neighbours"></span
              ></label>

              <label class="ck"
                ><input type="checkbox" id="relief" onchange="render()" /> <span data-i18n="show_relief"></span
              ></label>
              <label class="ck"
                ><input
                  type="checkbox"
                  id="focusHide"
                  onchange="
                    S.focusHide = this.checked;
                    render();
                  " />
                <span data-i18n="focus_hide"></span
              ></label>
              <label class="ck" data-i18n-title="autodetail_t"
                ><input type="checkbox" id="autoDetail" checked onchange="setAutoDetail(this.checked)" />
                <span data-i18n="autodetail"></span
              ></label>
              <label class="ck"
                ><input type="checkbox" id="homeAsk" checked onchange="setHomeAsk(this.checked)" />
                <span data-i18n="home_ask"></span
              ></label>

              <label class="ck"
                ><input type="checkbox" id="detail" checked onchange="render()" /> <span data-i18n="detail_coast"></span
              ></label>
              <label class="lvl" data-i18n-title="detail_level_t"
                ><span data-i18n="detail_level"></span
                ><input
                  type="range"
                  id="detailLevel"
                  min="0"
                  max="3"
                  step="1"
                  value="0"
                  oninput="setDetailLevel(+this.value)" /><b id="detailLevelV"></b
              ></label>
              <label class="lvl" data-i18n-title="city_min_t"
                ><span data-i18n="city_min"></span
                ><input
                  type="range"
                  id="cityMin"
                  min="0"
                  max="8"
                  step="1"
                  value="0"
                  oninput="setCityMin(+this.value)" /><b id="cityMinV"></b
              ></label>
            </div>
          </section>
        </div>
        <div class="tab" data-tab="highlight">
          <section class="sec" data-sec="data">
            <h2 onclick="toggleSec('data')">
              <span class="chev"></span><span data-i18n="sec_data"></span><span class="sum" id="dataInfo"></span>
            </h2>
            <div class="body">
              <div class="row">
                <select
                  id="attrSel"
                  onchange="
                    S.attr = this.value;
                    ui();
                    render();
                  "
                  style="flex: 1"
                ></select>
                <button class="chip" onclick="attrToGroups()" id="attrBtn">
                  <span data-i18n="attr_to_groups"></span>
                </button>
              </div>
              <select
                id="attrScope"
                onchange="
                  S.attrScope = this.value;
                  render();
                "
                data-i18n-title="scope_t"
              ></select>
            </div>
          </section>
          <section class="sec" data-sec="groups">
            <h2 onclick="toggleSec('groups')">
              <span class="chev"></span><span data-i18n="sec_groups"></span>
              <span class="help" data-i18n-title="groups_note" onclick="event.stopPropagation()">ⓘ</span
              ><span class="sum" id="count"></span>
            </h2>
            <div class="body">
              <div id="groups"></div>
              <div class="row">
                <button class="chip" onclick="addGroup()"><span data-i18n="new_group"></span></button>
                <button class="chip" id="addSubBtn" onclick="addSubgroup()" data-i18n-title="add_sub_t">
                  <span data-i18n="add_sub"></span>
                </button>
                <button class="chip" onclick="clearGroups()"><span data-i18n="clear_groups"></span></button>
              </div>
              <select
                id="regionPresets"
                onchange="
                  presetRegionActive(this.value);
                  this.value = '';
                "
              ></select>
            </div>
          </section>
        </div>
        <div class="tab" data-tab="look">
          <section class="sec" data-sec="style">
            <h2 onclick="toggleSec('style')">
              <span class="chev"></span><span data-i18n="sec_style"></span><span class="sum" id="styleNo"></span>
            </h2>
            <div class="body">
              <label class="ck" data-i18n-title="guard_t"
                ><input
                  type="checkbox"
                  id="guard"
                  checked
                  onchange="
                    S.guard = this.checked;
                    render();
                  " />
                <span data-i18n="guard"></span
              ></label>
              <div class="grid3" id="styles"></div>
              <div class="fxcat" data-i18n="fxc_decor"></div>
              <div id="decoUI"></div>
              <select id="frameSel" onchange="render()">
                <option value="auto" data-i18n="frame_auto"></option>
                <option value="on" data-i18n="frame_on"></option>
                <option value="off" data-i18n="frame_off"></option>
              </select>
            </div>
          </section>
          <section class="sec" data-sec="fx">
            <h2 onclick="toggleSec('fx')">
              <span class="chev"></span><span data-i18n="sec_fx"></span><span class="sum" id="fxInfo"></span>
            </h2>
            <div class="body">
              <select id="fxPreset" onchange="applyFxPreset(this.value)"></select>
              <select
                id="fxFrame"
                onchange="
                  S.fx.frame = this.value;
                  S.fx.preset = '';
                  ui();
                  render();
                "
              ></select>
              <div id="fxLight"></div>
              <div id="fxList"></div>
              <div class="row">
                <label class="ck"
                  ><span data-i18n="fx_surface"></span>
                  <input
                    type="color"
                    id="fxSurface"
                    oninput="
                      S.fx.surface = this.value;
                      render();
                    "
                /></label>
                <button class="chip" onclick="fxShuffle()" data-i18n="fx_shuffle"></button>
              </div>
            </div>
          </section>
        </div>
        <div class="tab" data-tab="page">
          <section class="sec" data-sec="layout">
            <h2 onclick="toggleSec('layout')">
              <span class="chev"></span><span data-i18n="sec_layout"></span><span class="sum" id="layoutInfo"></span>
            </h2>
            <div class="body">
              <div class="grid4" id="layouts"></div>
            </div>
          </section>
          <section class="sec" data-sec="areas">
            <h2 onclick="toggleSec('areas')"><span class="chev"></span><span data-i18n="sec_areas"></span></h2>
            <div class="body">
              <label class="pgl"
                ><span data-i18n="pg_fill"></span
                ><select id="pgFill" onchange="pageSet('fill', this.value)" data-i18n-title="pg_fill_t">
                  <option value="area" data-i18n="pg_fill_area"></option>
                  <option value="sheet" data-i18n="pg_fill_sheet"></option>
                  <option value="page" data-i18n="pg_fill_page"></option></select
              ></label>
              <div class="note" data-i18n="pg_spacing"></div>
              <div class="pgd" id="pgRings"></div>
              <div class="pgrow">
                <label
                  ><span id="pgRingN"></span> <b id="pgRingV"></b
                  ><input type="range" id="pgRingW" min="0" max="20" step="0.5" oninput="ringSet(PG.ring, +this.value)"
                /></label>
                <button class="chip" id="pgRingStd" onclick="ringSet(PG.ring, null)" data-i18n="pg_r_std"></button>
              </div>
              <div class="note" id="pgRingNa" data-i18n="pg_r_na" hidden></div>
            </div>
          </section>
          <section class="sec" data-sec="headfoot">
            <h2 onclick="toggleSec('headfoot')"><span class="chev"></span><span data-i18n="sec_headfoot"></span></h2>
            <div class="body">
              <label class="ck" data-i18n-title="pg_header_t"
                ><input type="checkbox" id="pgHeader" checked onchange="pageSet('header', this.checked)" />
                <span data-i18n="pg_header"></span
              ></label>
              <label class="pgl"
                ><span data-i18n="pg_header_h"></span> <b id="pgHeaderHV"></b
                ><input
                  type="range"
                  id="pgHeaderH"
                  min="0"
                  max="30"
                  step="0.5"
                  oninput="pageSet('headerH', +this.value)"
              /></label>
              <label class="ck" data-i18n-title="pg_footer_t"
                ><input type="checkbox" id="pgFooter" checked onchange="pageSet('footer', this.checked)" />
                <span data-i18n="pg_footer"></span
              ></label>
              <div class="row2">
                <label
                  ><span data-i18n="pt_rows"></span
                  ><select id="ptRows" onchange="setFooterOpt('rows', +this.value)">
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                  </select></label
                >
                <label
                  ><span data-i18n="pt_margin"></span> <b id="ptMarginV"></b
                  ><input
                    type="range"
                    id="ptMargin"
                    min="0"
                    max="20"
                    step="0.5"
                    oninput="setFooterOpt('margin', +this.value)"
                /></label>
              </div>
              <div class="row2">
                <label
                  ><span data-i18n="pt_align"></span
                  ><select id="ptAlign" onchange="setFooterOpt('align', this.value)">
                    <option value="left" data-i18n="al_left"></option>
                    <option value="center" data-i18n="al_center"></option>
                    <option value="right" data-i18n="al_right"></option></select
                ></label>
              </div>
              <div class="row2 rowaligns" id="ptRowAlign"></div>
              <label class="ck" data-i18n-title="pt_auto_t"
                ><input type="checkbox" id="ptAuto" checked onchange="setFooterOpt('autoScale', this.checked)" />
                <span data-i18n="pt_auto"></span
              ></label>
              <button class="chip" onclick="jumpTo(secOf('partners'))"><span data-i18n="pg_to_partners"></span></button>
            </div>
          </section>
          <section class="sec" data-sec="text">
            <h2 onclick="toggleSec('text')">
              <span class="chev"></span><span data-i18n="sec_texts"></span><span class="sum" id="textInfo"></span>
            </h2>
            <div class="body">
              <label class="ck"
                ><input type="checkbox" id="showText" checked onchange="render()" /> <span data-i18n="show_title"></span
              ></label>
              <label class="ck"
                ><input type="checkbox" id="autoText" checked onchange="render()" /> <span data-i18n="auto_text"></span
              ></label>
              <label class="ck"
                ><input type="checkbox" id="legend" checked onchange="render()" /> <span data-i18n="show_legend"></span
              ></label>
              <input
                type="text"
                id="title"
                value=""
                oninput="
                  document.getElementById('autoText').checked = false;
                  render();
                "
                data-i18n-ph="ph_title"
              />
              <input
                type="text"
                id="sub"
                value=""
                oninput="
                  document.getElementById('autoText').checked = false;
                  render();
                "
                data-i18n-ph="ph_sub"
              />
              <div class="row2">
                <label
                  ><span data-i18n="pos_title_l"></span
                  ><select id="titlePos" onchange="render()">
                    <option value="auto" data-i18n="pos_auto"></option>
                    <option value="tl" data-i18n="pos_tl"></option>
                    <option value="tc" data-i18n="pos_tc"></option>
                    <option value="tr" data-i18n="pos_tr"></option>
                    <option value="bl" data-i18n="pos_bl"></option>
                    <option value="bc" data-i18n="pos_bc"></option>
                    <option value="br" data-i18n="pos_br"></option></select
                ></label>
                <label
                  ><span data-i18n="pos_sub_l"></span
                  ><select id="subPos" onchange="render()">
                    <option value="under" data-i18n="pos_under"></option>
                    <option value="tl" data-i18n="pos_tl"></option>
                    <option value="tc" data-i18n="pos_tc"></option>
                    <option value="tr" data-i18n="pos_tr"></option>
                    <option value="bl" data-i18n="pos_bl"></option>
                    <option value="bc" data-i18n="pos_bc"></option>
                    <option value="br" data-i18n="pos_br"></option></select
                ></label>
              </div>
              <div class="row2">
                <label
                  ><span data-i18n="tfx_l"></span
                  ><select id="titleFx" onchange="setTextFx('title', this.value)"></select
                ></label>
                <label
                  ><span data-i18n="sfx_l"></span
                  ><select id="subFx" onchange="setTextFx('sub', this.value)"></select
                ></label>
              </div>
              <div id="txList"></div>
              <div class="row">
                <button class="chip" onclick="addText()" data-i18n-title="tx_add_t">
                  + <span data-i18n="tx_add"></span>
                </button>
              </div>
              <label class="ck"
                ><input type="checkbox" id="txTest" onchange="txTest(this.checked)" /> <span data-i18n="tr_test"></span
              ></label>
              <div class="row">
                <button class="chip" onclick="resetDrag()" data-i18n-title="drag_reset_t">
                  <span data-i18n="drag_reset"></span>
                </button>
                <span class="note" data-i18n="drag_hint"></span>
              </div>
              <label class="ck"
                ><input type="checkbox" id="snapCk" checked onchange="setSnap(this.checked)" />
                <span data-i18n="snap"></span
              ></label>
            </div>
          </section>
        </div>
        <div class="tab" data-tab="brand">
          <section class="sec" data-sec="ds">
            <h2 onclick="toggleSec('ds')">
              <span class="chev"></span><span data-i18n="sec_ds"></span><span class="sum" id="dsName"></span>
            </h2>
            <div class="body">
              <select id="ds2" onchange="setDS(this.value)" data-i18n-title="sec_ds"></select>
              <label class="ck" data-i18n-title="ds_colours_t"
                ><input
                  type="checkbox"
                  id="dsColours"
                  onchange="
                    S.dsColours = this.checked;
                    render();
                  " />
                <span data-i18n="ds_colours"></span
              ></label>
              <div class="row" id="dsSw"></div>
              <button class="chip" onclick="dsEditOpen()"><span data-i18n="dse_open"></span></button>
              <details id="dsEdit">
                <summary data-i18n="dse_title"></summary>
                <div id="dsEditBody"></div>
                <input
                  type="file"
                  id="dseLogo"
                  accept="image/*"
                  hidden
                  onchange="
                    dsEditLogo(this.files[0]);
                    this.value = '';
                  "
                />
                <div class="row">
                  <button class="chip on" onclick="dsEditSave()"><span data-i18n="save"></span></button>
                  <button class="chip" onclick="dsEditCancel()"><span data-i18n="dse_cancel"></span></button>
                </div>
              </details>
              <details id="manage">
                <summary data-i18n="manage_profiles"></summary>
                <div class="row">
                  <button class="chip" onclick="document.getElementById('dsFile').click()">
                    <span data-i18n="import"></span>
                  </button>
                  <button class="chip" onclick="openEditor()"><span data-i18n="edit_new"></span></button>
                  <button class="chip" onclick="exportDS()"><span data-i18n="export_json"></span></button>
                  <button class="chip" onclick="exportSidecar()">designsystems.js</button>
                  <button class="chip" id="dsDel" onclick="deleteDS()"><span data-i18n="delete"></span></button>
                  <input
                    type="file"
                    id="dsFile"
                    accept=".json,.js,application/json"
                    hidden
                    onchange="
                      importDSFile(this.files[0]);
                      this.value = '';
                    "
                  />
                </div>
                <details id="editor">
                  <summary data-i18n="editor_sum"></summary>
                  <textarea id="dsJson" rows="12" class="mono"></textarea>
                  <div class="row">
                    <button class="chip" onclick="document.getElementById('logoFile').click()">
                      <span data-i18n="pick_logo"></span>
                    </button>
                    <input
                      type="file"
                      id="logoFile"
                      accept="image/*"
                      hidden
                      onchange="
                        pickLogo(this.files[0]);
                        this.value = '';
                      "
                    />
                    <button class="chip on" onclick="applyEditor()"><span data-i18n="save"></span></button>
                  </div>
                  <p class="note" data-i18n="editor_note"></p>
                </details>
              </details>
            </div>
          </section>
          <section class="sec" data-sec="logo">
            <h2 onclick="toggleSec('logo')"><span class="chev"></span><span data-i18n="sec_logo"></span></h2>
            <div class="body">
              <label class="ck"
                ><input type="checkbox" id="showLogo" checked onchange="render()" /> <span data-i18n="show_logo"></span
              ></label>
              <label
                ><span data-i18n="tx_size"></span> <b id="logoSizeV"></b
                ><input
                  type="range"
                  id="logoSize"
                  min="30"
                  max="300"
                  step="1"
                  value="100"
                  oninput="logoSet('scale', this.value / 100)"
              /></label>
              <input type="url" id="logoLink" data-i18n-ph="ph_link" oninput="logoSet('link', this.value)" />
              <p class="note" data-i18n="logo_note"></p>
            </div>
          </section>
          <section class="sec" data-sec="partners">
            <h2 onclick="toggleSec('partners')">
              <span class="chev"></span><span data-i18n="sec_partners"></span
              ><span class="sum" id="partnerCount"></span>
            </h2>
            <div class="body">
              <label class="ck"
                ><input type="checkbox" id="showFooter" checked onchange="render()" />
                <span data-i18n="show_footer"></span
              ></label>
              <input
                type="text"
                id="footerLabel"
                value=""
                oninput="
                  this.dataset.auto = '0';
                  render();
                "
                data-i18n-ph="ph_footer"
              />
              <div id="partners"></div>
              <details>
                <summary data-i18n="add_partner"></summary>
                <input type="text" id="pName" data-i18n-ph="ph_name" />
                <input type="url" id="pLink" data-i18n-ph="ph_link" />
                <div class="row">
                  <button class="chip" onclick="document.getElementById('pFile').click()">
                    <span data-i18n="pick_logo_p"></span>
                  </button>
                  <input
                    type="file"
                    id="pFile"
                    accept="image/*"
                    hidden
                    onchange="
                      pickPartnerLogo(this.files[0]);
                      this.value = '';
                    "
                  />
                  <span id="pFileName" class="note"></span>
                  <button class="chip on" onclick="addPartner()"><span data-i18n="add"></span></button>
                </div>
                <p class="note" data-i18n="partner_note"></p>
              </details>
              <label class="ck" data-i18n-title="pb_bd_t"
                ><input type="checkbox" id="pbBd" onchange="pbSet('bd', this.checked)" /> <span data-i18n="pb_bd"></span
              ></label>
              <div id="pbBorder" hidden>
                <div class="row2">
                  <label
                    ><span data-i18n="dc_thick"></span> <b id="pbWV"></b
                    ><input type="range" id="pbW" min="0.5" max="12" step="0.5" oninput="pbSet('bw', +this.value)"
                  /></label>
                  <label
                    ><span data-i18n="pb_round"></span> <b id="pbRV"></b
                    ><input type="range" id="pbR" min="0" max="60" step="1" oninput="pbSet('br', +this.value)"
                  /></label>
                </div>
                <div class="row2">
                  <label
                    ><span data-i18n="pb_line"></span
                    ><select id="pbLine" onchange="pbSet('bs', this.value)"></select
                  ></label>
                  <label
                    ><span data-i18n="dc_colour"></span
                    ><select id="pbColMode" onchange="pbSet('bc', this.value === 'own' ? pbOwnColour() : '')">
                      <option value="ink" data-i18n="dc_col_ink"></option>
                      <option value="own" data-i18n="dc_col_own"></option></select
                    ><input type="color" id="pbCol" hidden oninput="pbSet('bc', this.value)"
                  /></label>
                </div>
              </div>
              <div class="row2">
                <label class="wide"
                  ><span data-i18n="pb_size"></span> <b id="pbSizeV"></b
                  ><input
                    type="range"
                    id="pbSize"
                    min="30"
                    max="300"
                    step="1"
                    value="100"
                    oninput="pbSet('scale', this.value / 100)"
                /></label>
              </div>
              <button class="chip on" id="pbBack" onclick="pbBack()" hidden><span data-i18n="pt_back"></span></button>
              <p class="note" data-i18n="pb_note"></p>
            </div>
          </section>
        </div>
        <div class="about">
          MoboMap © 2026 Morten Bonding · AGPL-3.0 ·
          <a href="https://github.com/morbobon/MoboMap" target="_blank" rel="noopener" data-i18n="about_src"></a>
        </div>
      </aside>
      <div class="stage">
        <div id="wrap">
          <div id="pane"><svg id="svg" viewBox="0 0 1000 800" xmlns="http://www.w3.org/2000/svg"></svg></div>
          <div id="pih" hidden></div>
          <div id="stepBar" hidden>
            <button class="chip" onclick="txStep(-1)" data-i18n-title="tr_prev">‹</button>
            <span id="stepN"></span>
            <button class="chip" onclick="txStep(1)" data-i18n-title="tr_next">›</button>
          </div>
        </div>
        <div id="mapCtl">
          <button id="fsExit" class="chip" onclick="toggleFullscreen()" data-i18n="fs_exit"></button>
          <button id="zoomReset" class="chip" onclick="resetZoom()" data-i18n="zoom_reset"></button>
          <button id="psBtn" class="chip" onclick="psPop()"></button>
          <div class="lockgrp">
            <button id="lockBtn" class="chip" onclick="toggleLock()" aria-pressed="false"></button>
            <button id="lockMore" class="chip" onclick="lockPop()" data-i18n-title="lock_opts_t">▾</button>
          </div>
          <div id="psPop" hidden>
            <div class="row"><b data-i18n="ps_l"></b> <span class="note" id="psVal"></span></div>
            <div class="row psrow">
              <button class="chip" onclick="pageScale(PS / 1.25)">−</button>
              <input type="range" id="psRange" min="1" max="4" step="0.05" value="1" oninput="pageScale(+this.value)" />
              <button class="chip" onclick="pageScale(PS * 1.25)">+</button>
              <button class="chip" onclick="pageScale(1)">100 %</button>
            </div>
            <div class="note" data-i18n="ps_note"></div>
          </div>
          <div id="lockPop" hidden>
            <label class="ck"
              ><input type="checkbox" id="lkOn" onchange="toggleLock(this.checked)" /> <b data-i18n="lock_on"></b
            ></label>
            <div class="note" data-i18n="lock_what"></div>
            <label class="ck"
              ><input type="checkbox" id="lkPos" onchange="setLock('pos', this.checked)" />
              <span data-i18n="lock_pos"></span
            ></label>
            <label class="lkz"
              ><span data-i18n="lock_zoom"></span
              ><select id="lkZoom" onchange="setLock('zoom', +this.value)">
                <option value="0" data-i18n="lock_z_free"></option>
                <option value="1" data-i18n="lock_z_none"></option>
                <option value="2" data-i18n="lock_z_range"></option></select
            ></label>
            <div class="row2" id="lkRange">
              <label
                ><span data-i18n="lock_min"></span
                ><input type="number" id="lkMin" min="0.3" max="40" step="0.5" onchange="setLockRange()"
              /></label>
              <label
                ><span data-i18n="lock_max"></span
                ><input type="number" id="lkMax" min="0.3" max="40" step="0.5" onchange="setLockRange()"
              /></label>
            </div>
            <label class="ck"
              ><input type="checkbox" id="lkHl" onchange="setLock('hl', this.checked)" />
              <span data-i18n="lock_hl"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="lkItems" onchange="setLock('items', this.checked)" />
              <span data-i18n="lock_items"></span
            ></label>
            <label class="ck"
              ><input type="checkbox" id="lkEdit" onchange="setLock('edit', this.checked)" />
              <span data-i18n="lock_edit"></span
            ></label>
            <div class="note" data-i18n="lock_note"></div>
          </div>
        </div>
        <div class="looksbar">
          <div id="looks" class="looks"></div>
          <button class="striphide" onclick="toggleChrome('strip')" data-i18n-title="toggle_strip">︾</button>
          <button class="stripmin" onclick="setChrome('strip', 'min')" data-i18n-title="strip_min_t">︾</button>
        </div>
        <button class="stripshow" onclick="setChrome('strip', true)" data-i18n-title="toggle_strip">︽</button>
      </div>
    </main>
    <div id="tip"></div>
    <div id="ctx" role="menu"></div>
    <div id="toast"></div>
    <dialog id="printDlg">
      <h3 data-i18n="print_title"></h3>
      <p data-i18n="print_info"></p>
      <label
        ><span data-i18n="print_size"></span
        ><select id="prSize" onchange="printUpdate()"></select
      ></label>
      <label id="prCustomL"
        ><span data-i18n="print_width"></span
        ><input type="number" id="prWidth" min="20" max="5000" step="1" oninput="printUpdate()"
      /></label>
      <label
        ><span data-i18n="print_dpi"></span
        ><select id="prDpi" onchange="printUpdate()">
          <option value="150" data-i18n="print_dpi150"></option>
          <option value="300" data-i18n="print_dpi300"></option>
          <option value="600" data-i18n="print_dpi600"></option></select
      ></label>
      <label
        ><span data-i18n="print_fmt"></span
        ><select id="prFmt" onchange="printUpdate()">
          <option value="pdf">PDF</option>
          <option value="png">PNG</option>
          <option value="jpg">JPG</option>
        </select></label
      >
      <div class="prsum" id="prSum"></div>
      <div class="prwarn" id="prWarn"></div>
      <div class="row prbtns">
        <button class="exp" id="prGo" onclick="printGo()" data-i18n="print_go"></button>
        <button onclick="document.getElementById('printDlg').close()" data-i18n="home_cancel"></button>
      </div>
    </dialog>
    <dialog id="homeDlg">
      <h3 data-i18n="home_q"></h3>
      <p data-i18n="home_info"></p>
      <div class="col">
        <button class="chip" onclick="homeSave('look')" data-i18n="home_look"></button>
        <button class="chip" onclick="homeSave('project')" data-i18n="home_project"></button>
        <button class="chip" onclick="homeSave('leave')" data-i18n="home_leave"></button>
        <button class="chip" onclick="homeSave('cancel')" data-i18n="home_cancel"></button>
      </div>
      <label class="ck"><input type="checkbox" id="homeNoAsk" /> <span data-i18n="home_noask"></span></label>
    </dialog>
    <script>
      /*__JS__*/
    </script>
  </body>
</html>
